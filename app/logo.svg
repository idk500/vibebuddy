<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Speech bubble / buddy shape -->
  <path d="M256 88 C160 88 96 152 96 228 C96 296 148 348 216 364 L216 424 L280 360 C372 352 416 296 416 228 C416 152 352 88 256 88Z" fill="white" opacity="0.95"/>
  <!-- Left eye (status dot) -->
  <circle cx="210" cy="212" r="24" fill="#6366F1"/>
  <!-- Right eye -->
  <circle cx="302" cy="212" r="24" fill="#6366F1"/>
  <!-- Smile -->
  <path d="M200 268 Q256 320 312 268" fill="none" stroke="#6366F1" stroke-width="18" stroke-linecap="round"/>
  <!-- Status indicator dot (top-right) -->
  <circle cx="388" cy="124" r="44" fill="#10B981"/>
  <circle cx="388" cy="124" r="44" fill="#10B981" opacity="0.5">
    <animate attributeName="r" values="44;56;44" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>